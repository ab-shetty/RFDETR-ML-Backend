version: "3.8"

services:
  rfdetr:
    container_name: rfdetr
    image: humansignal/rfdetr:v0
    build:
      context: .
    environment:
      - LOG_LEVEL=INFO
      - WORKERS=1
      - THREADS=4
      # Label Studio connection — uses LABEL_STUDIO_DOCKER_HOST for internal Docker networking.
      # Set LABEL_STUDIO_DOCKER_HOST in .env only if host.docker.internal is not available.
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_DOCKER_HOST:-http://host.docker.internal:8080}
      - LABEL_STUDIO_URL=${LABEL_STUDIO_DOCKER_HOST:-http://host.docker.internal:8080}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      # RF-DETR parameters
      - ALLOW_CUSTOM_MODEL_PATH=true
      - MODEL_SCORE_THRESHOLD=0.5
      - MODEL_ROOT=/app/models
      # OCR + embedding + GPT-5-mini verification cascade (see cascade/pipeline.py).
      # Off by default; set CASCADE_ENABLED=true once ocr_expected_text.json and
      # reference_gallery.npz exist in ./models (scripts/build_ocr_expected_text.py,
      # scripts/build_reference_gallery.py).
      - CASCADE_ENABLED=${CASCADE_ENABLED:-false}
      # Shelf-tag SKU-correction (needs models/tag_class_map.json + OPENAI_API_KEY)
      - SHELF_TAGS_ENABLED=${SHELF_TAGS_ENABLED:-false}
      - CASCADE_FLOOR=${CASCADE_FLOOR:-0.15}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9091"
    shm_size: "2gb"
    volumes:
      - "./models:/app/models"
